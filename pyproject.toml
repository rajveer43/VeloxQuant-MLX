[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "VeloxQuant-MLX"
version = "0.82.2"
description = "Fast KV-cache quantization for Apple Silicon (MLX) — 43 research-adapted compression methods, from TurboQuant and KIVI to A2ATS, with Metal kernels"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Rajveer Rathod" },
    { name = "Rajveer Rathod", email = "rathodrajveer1311@gmail.com" },
]
maintainers = [
    { name = "Rajveer Rathod", email = "rathodrajveer1311@gmail.com" },
]
keywords = [
    "quantization", "kv-cache", "llm", "mlx", "apple-silicon",
    "turboquant", "ratequant", "rvq", "polarquant", "qjl",
    "rabitq", "commvq", "spectralquant", "vecinfer",
    "inference", "compression", "mixed-precision",
    "kv cache compression", "llm memory reduction", "apple silicon llm",
    "long context inference", "attention cache quantization",
    "metal kernels", "on-device llm", "local llm inference",
    "context length extension", "mlx-lm", "token eviction",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Environment :: MacOS X",
    "Environment :: GPU",
    "Operating System :: MacOS",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: System :: Hardware",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Natural Language :: English",
    "Typing :: Typed",
]
dependencies = [
    "mlx>=0.18",
    "mlx-lm>=0.31.3",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
plots = [
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "pytest-xdist",
    "psutil>=5.9",
    "build>=1.2",
    "twine>=5.0",
    "python-semantic-release>=9.15",
    # GitPython 3.1.60 (2026-08-25) removed the `Actor.name_email_regex`
    # class attribute that python-semantic-release<=10.6.1 still reads
    # (semantic_release/cli/config.py), breaking `semantic-release version
    # --print` with "type object 'Actor' has no attribute
    # 'name_email_regex'". Pin below that release until PSR ships a fix
    # for the new GitPython API.
    "GitPython<3.1.60",
    "pre-commit>=3.7",
    "ruff>=0.6",
]

[project.urls]
Homepage           = "https://github.com/rajveer43/VeloxQuant-MLX"
Repository       = "https://github.com/rajveer43/VeloxQuant-MLX"
"Bug Tracker" = "https://github.com/rajveer43/VeloxQuant-MLX/issues"
Author        = "https://github.com/rajveer43"
Changelog     = "https://github.com/rajveer43/VeloxQuant-MLX/blob/master/CHANGELOG.md"
Documentation = "https://veloxquant-mlx.netlify.app/"

[project.scripts]
veloxquant = "veloxquant_mlx.__main__:main"
mlx-kv-quant = "veloxquant_mlx.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["veloxquant_mlx*"]

[tool.setuptools.package-data]
# The control panel's frontend is plain static files with no build step, so
# they must be shipped in the wheel alongside the Python sources.
"veloxquant_mlx.ui" = ["static/*"]
veloxquant_mlx = ["metal/src/*.metal", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["veloxquant_mlx/tests"]
addopts = "-v"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# N (pep8-naming) and ARG (unused-arguments) were evaluated and rejected,
# not just left off by default:
#   - N: ~2372 violations, 96% of them N806/N803 flagging single-letter
#     tensor-dimension names (D, H, B, N, K...) that are this codebase's
#     established convention, matching the papers it implements. Not a
#     real naming problem.
#   - ARG: 59 violations, most of them deliberate -- factory/protocol-
#     conforming constructor params ("accepted for QuantizerFactory
#     parity"), static-method overrides matching a base class signature,
#     and mock/stub callables matching a caller's expected arity. Fixing
#     these for real would mean breaking interface contracts across the
#     quantizer/cache factory pattern; enabling the rule would mostly
#     produce scoped noqas rather than genuine fixes.
select = ["E", "F", "I", "W", "UP", "B", "PTH", "RET", "SIM", "C4"]
# E501 (line too long) stays ignored: checked all 25 lines over 100 chars
# in veloxquant_mlx/ as of the audit that added the rule groups above --
# every one is an f-string/docstring/comment/help-text literal (table
# formatting, error messages, long method-name lists) that can't wrap
# without hurting readability, not real multi-statement code.
ignore = ["E501"]

[tool.ruff.lint.isort]
known-first-party = ["veloxquant_mlx"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["veloxquant_mlx/__init__.py:__version__"]
# Empty string, not `false`: python-semantic-release >=10 validates this as a
# string, and a bool raises a pydantic error that `semantic-release version
# --print` reports on stderr. The release workflow swallows that stderr and
# falls back to an empty version, so the bad value made every run silently
# take the "No release needed" branch instead of failing loudly.
build_command = ""
commit_parser = "conventional"
commit_message = "chore(release): {version} [skip ci]"
tag_format = "v{version}"
# Both are required to stay on 0.x. `major_on_zero = false` alone only stops a
# *breaking change* from forcing 1.0.0; without `allow_zero_version` PSR still
# graduates the project to 1.0.0 on the next release.
major_on_zero = false
allow_zero_version = true

[tool.semantic_release.branches.main]
match = "master"

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = [
    "^chore\\(release\\):",
]
# Default mode is "init" -- regenerate-from-scratch, only if CHANGELOG.md
# doesn't already exist. This repo's CHANGELOG.md was hand-authored before
# any release ran, so every release silently no-op'd on it forever (no
# error, no diff) until this was set. "update" prepends each new version's
# section above the `<!-- version list -->` marker in the existing file.
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "chore", "test", "build", "ci", "style"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
