[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "VeloxQuant-MLX"
version = "0.91.1"
description = "Fast KV-cache quantization for Apple Silicon (MLX) — 43 research-adapted compression methods, from TurboQuant and KIVI to A2ATS, with Metal kernels"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Rajveer Rathod", email = "rathodrajveer1311@gmail.com" },
]
maintainers = [
    { name = "Rajveer Rathod", email = "rathodrajveer1311@gmail.com" },
]
keywords = [
    "quantization", "kv-cache", "llm", "mlx", "apple-silicon",
    "turboquant", "ratequant", "rvq", "polarquant", "qjl",
    "rabitq", "commvq", "spectralquant", "vecinfer",
    "inference", "compression", "mixed-precision",
    "kv cache compression", "llm memory reduction", "apple silicon llm",
    "long context inference", "attention cache quantization",
    "metal kernels", "on-device llm", "local llm inference",
    "context length extension", "mlx-lm", "token eviction",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Environment :: MacOS X",
    "Environment :: GPU",
    "Operating System :: MacOS",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Mathematics",
    "Topic :: System :: Hardware",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Libraries",
    "Natural Language :: English",
    "Typing :: Typed",
]
dependencies = [
    "mlx>=0.18",
    "mlx-lm>=0.31.3",
    "numpy>=1.26",
    "scipy>=1.11",
]

[project.optional-dependencies]
plots = [
    "matplotlib>=3.8",
]
test = [
    "pytest>=8.0",
    "pytest-xdist",
    "pytest-cov>=5.0",
    "psutil>=5.9",
]
dev = [
    "VeloxQuant-MLX[test]",
    "pre-commit>=3.7",
    "ruff>=0.6",
    "mypy>=1.11",
]
# Only the release workflow (.github/workflows/release.yml) needs this group --
# it bumps the version, builds the sdist/wheel, and drives semantic-release's
# commit parsing. Kept out of `dev` so contributors and the lint/test CI jobs
# don't install the release toolchain just to run pytest or ruff. See #472.
release = [
    "build>=1.2",
    "twine>=5.0",
    "python-semantic-release>=9.15",
    "GitPython<3.1.60",
]

[project.urls]
Homepage           = "https://github.com/rajveer43/VeloxQuant-MLX"
Repository       = "https://github.com/rajveer43/VeloxQuant-MLX"
"Bug Tracker" = "https://github.com/rajveer43/VeloxQuant-MLX/issues"
Author        = "https://github.com/rajveer43"
Changelog     = "https://github.com/rajveer43/VeloxQuant-MLX/blob/master/CHANGELOG.md"
Documentation = "https://veloxquant-mlx.netlify.app/"

[project.scripts]
veloxquant = "veloxquant_mlx.__main__:main"
mlx-kv-quant = "veloxquant_mlx.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["veloxquant_mlx*"]
# The `veloxquant_mlx*` glob above also matches `veloxquant_mlx.tests` and its
# subpackages, which silently put 184 test files -- 18.4% of the wheel's
# uncompressed payload -- into every PyPI install. 138 of them import `pytest`
# or `psutil`, neither of which is a runtime dependency, so they were
# unimportable in a default install anyway.
#
# This `exclude` drives BOTH artifacts, so on its own it also strips the tests
# from the sdist -- which would break the reproducibility story, since the sdist
# is what a reviewer unpacks to run `pytest`. MANIFEST.in grafts them back into
# the sdist only; keep the two in sync if this list ever changes. See #434.
exclude = ["veloxquant_mlx.tests", "veloxquant_mlx.tests.*"]

[tool.setuptools.package-data]
# The control panel's frontend is plain static files with no build step, so
# they must be shipped in the wheel alongside the Python sources.
"veloxquant_mlx.ui" = ["static/*"]
veloxquant_mlx = ["metal/src/*.metal", "py.typed"]

[tool.setuptools.exclude-package-data]
# Under pyproject.toml setuptools defaults `include-package-data = true`, which
# makes MANIFEST.in feed the *wheel* too -- so the `recursive-include` there
# that keeps tests in the sdist would otherwise put them straight back into the
# wheel, defeating the `exclude` in [tool.setuptools.packages.find]. Prune them
# from the wheel explicitly. See #434.
veloxquant_mlx = ["tests/*", "tests/**/*"]

[tool.pytest.ini_options]
testpaths = ["veloxquant_mlx/tests"]
addopts = "-v"
filterwarnings = ["ignore::DeprecationWarning"]
markers = [
    "metal: requires a real Metal device (mx.fast.metal_kernel); select with -m metal, deselect with -m 'not metal'. Tests still self-skip via metal_available() when run where Metal is genuinely absent -- this marker exists so CI can also *choose* to exclude or isolate them, e.g. to keep a hosted-runner correctness job separate from a bare-metal performance job.",
]

[tool.coverage.run]
source = ["veloxquant_mlx"]
# Test files themselves inflate the number without saying anything about the
# library: pytest collecting and executing a test body already "covers" its
# lines. Omitting them is what turns a self-referential ~91% into the
# source-only number (measured 81.5%, #437) that actually describes how much
# of the shipped package the suite exercises.
omit = ["veloxquant_mlx/tests/*"]

[tool.coverage.report]
# 80%, not the measured 81.5%: a floor just under the current value blocks
# regression without requiring new tests to land it. Deliberately the
# measured number rounded down, not an aspirational target -- see #437 for
# where the gap actually is (benchmarks/ and cli/ are ~0% covered and are
# the main drag; closing that is separate follow-up work, not implied by
# this floor).
#
# Measured on the MLX lane only (mlx-tests.yml, macos-14, one matrix leg --
# see that workflow's coverage step). tests/non_metal/ (non-metal-unit.yml,
# ubuntu, no MLX installed) is not gated: it deliberately never imports
# veloxquant_mlx at all, so a repo-wide or combined percentage there would
# either fail permanently or require a floor low enough to measure nothing.
fail_under = 80

[tool.mypy]
# 3.12, not the 3.10 floor in `requires-python`: numpy's bundled stubs use the
# PEP 695 `type X = ...` alias syntax, which mypy only parses when the
# configured target is 3.12+. Pinning this to the floor makes mypy fail
# outright ("Type statement is only supported in Python 3.12 and greater")
# against any numpy satisfying this project's own `numpy>=1.26` dependency
# floor, before it even reaches real code.
#
# This is a type-checking target only: it does not narrow what the package
# supports or runs on. `requires-python = ">=3.10"` is what users install
# against, and CI runs the suite on 3.10 through 3.14.
python_version = "3.12"
ignore_missing_imports = true

# Per-module strictness ladder. These modules pass the flags below today, so
# enabling them costs nothing now and stops the layer everything else types
# against from regressing. The package ships `py.typed`, so downstream type
# checkers consume these annotations -- this is what makes that marker mean
# something.
#
# NOT a repo-wide strict flip. The remaining ~343 shipped-source errors are
# dominated by mlx/numpy scalar-union stub artifacts (`int | float | complex`,
# `floating`, `bool_` reaching `float()` and index positions), plus 12
# `union-attr` hits on documented "None until loaded" fields guarded by
# separate `is_loaded()`-style predicates mypy cannot correlate with a later
# attribute access. Neither bucket is a confirmed runtime bug, and both want
# design work rather than a flag. See #438 for the full triage.
#
# `warn_redundant_casts` is deliberately absent despite being in #438's
# proposed snippet: it is a *global-only* flag. Inside a per-module section
# mypy prints "Per-module sections should only specify per-module flags" and
# then exits 0 -- a permanent warning on every run that never fails anything.
# If you want it, set it at the top level of [tool.mypy], not here.
#
# To extend the ladder: run the module under these flags, and only add it once
# it is already clean. `cache/base.py` is the next candidate -- its 10 errors
# are all `[no-untyped-def]` (missing annotations, not type errors).
[[tool.mypy.overrides]]
module = [
    "veloxquant_mlx.core.abstractions",
    "veloxquant_mlx.memory.block_pool",
    "veloxquant_mlx.cache.options",
    "veloxquant_mlx.cache.registry",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
no_implicit_optional = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
# N (pep8-naming) and ARG (unused-arguments) were evaluated and rejected,
# not just left off by default:
#   - N: ~2372 violations, 96% of them N806/N803 flagging single-letter
#     tensor-dimension names (D, H, B, N, K...) that are this codebase's
#     established convention, matching the papers it implements. Not a
#     real naming problem.
#   - ARG: 59 violations, most of them deliberate -- factory/protocol-
#     conforming constructor params ("accepted for QuantizerFactory
#     parity"), static-method overrides matching a base class signature,
#     and mock/stub callables matching a caller's expected arity. Fixing
#     these for real would mean breaking interface contracts across the
#     quantizer/cache factory pattern; enabling the rule would mostly
#     produce scoped noqas rather than genuine fixes.
select = ["E", "F", "I", "W", "UP", "B", "PTH", "RET", "SIM", "C4"]
# E501 (line too long) stays ignored: checked all 25 lines over 100 chars
# in veloxquant_mlx/ as of the audit that added the rule groups above --
# every one is an f-string/docstring/comment/help-text literal (table
# formatting, error messages, long method-name lists) that can't wrap
# without hurting readability, not real multi-statement code.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# B023: verified false positives, not fixed because fixing would make the code
# worse. Every flagged closure across these 8 benchmark harnesses is handed to
# a local timing helper (_bench/_timeit/bench_decode_step) that calls fn()
# synchronously inside its own loops and never stores, schedules, or returns
# it -- so the closure is fully consumed before the enclosing loop rebinds
# anything. Checked all 8 files for any deferral primitive
# (functools.partial/.append(lambda.../Thread/Pool/submit/asyncio/.map(/
# callback=/schedule): none present. Binding defaults to silence the rule
# would add ~9 dummy parameters per call site to benchmark code purely to
# satisfy a rule that isn't describing a real defect here -- one lambda at
# kv_kernel_roofline_bench.py:257 alone accounts for 9 of the 137 hits
# (q, k_codes, k_scale, k_zero, v_codes, v_scale, v_zero, scale, plus one
# more). See #435.
"scripts/*.py" = ["B023"]

# E402: these standalone scripts insert the repo root into sys.path so they
# run from a checkout without an install; the first-party imports below that
# line cannot be hoisted above it without breaking the whole point of the
# pattern. Standard sys.path-bootstrap exception. (benchmark_gemma4.py's two
# E402 hits were a different, genuinely fixable shape -- unrelated mid-file
# re-imports with no path dependency -- and were fixed directly rather than
# ignored; it no longer triggers this rule at all.) See #435.
"benchmark_scripts/*.py" = ["E402"]

[tool.ruff.lint.isort]
known-first-party = ["veloxquant_mlx"]

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["veloxquant_mlx/__init__.py:__version__"]
# Empty string, not `false`: python-semantic-release >=10 validates this as a
# string, and a bool raises a pydantic error that `semantic-release version
# --print` reports on stderr. The release workflow swallows that stderr and
# falls back to an empty version, so the bad value made every run silently
# take the "No release needed" branch instead of failing loudly.
build_command = ""
commit_parser = "conventional"
commit_message = "chore(release): {version} [skip ci]"
tag_format = "v{version}"
# Both are required to stay on 0.x. `major_on_zero = false` alone only stops a
# *breaking change* from forcing 1.0.0; without `allow_zero_version` PSR still
# graduates the project to 1.0.0 on the next release.
major_on_zero = false
allow_zero_version = true

[tool.semantic_release.branches.main]
match = "master"

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = [
    "^chore\\(release\\):",
]
# Default mode is "init" -- regenerate-from-scratch, only if CHANGELOG.md
# doesn't already exist. This repo's CHANGELOG.md was hand-authored before
# any release ran, so every release silently no-op'd on it forever (no
# error, no diff) until this was set. "update" prepends each new version's
# section above the `<!-- version list -->` marker in the existing file.
mode = "update"
insertion_flag = "<!-- version list -->"

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "chore", "test", "build", "ci", "style"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
