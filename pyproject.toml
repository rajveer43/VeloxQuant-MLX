[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "VeloxQuant-MLX"
version = "0.41.0"
description = "Fast KV-cache quantization for Apple Silicon (MLX) — 41 research-adapted compression methods, from TurboQuant and KIVI to A2ATS, with Metal kernels"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Rajveer Rathod" },
    { name = "Rajveer Rathod", email = "rathodrajveer1311@gmail.com" },
]
maintainers = [
    { name = "Rajveer Rathod", email = "rathodrajveer1311@gmail.com" },
]
keywords = [
    "quantization", "kv-cache", "llm", "mlx", "apple-silicon",
    "turboquant", "ratequant", "rvq", "polarquant", "qjl",
    "rabitq", "commvq", "spectralquant", "vecinfer",
    "inference", "compression", "mixed-precision",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: System :: Hardware",
]
dependencies = [
    "mlx>=0.18",
    "numpy>=1.26",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-xdist",
    "scipy>=1.11",
    "psutil>=5.9",
    "build>=1.2",
    "twine>=5.0",
    "python-semantic-release>=9.15",
]

[project.urls]
Homepage           = "https://github.com/rajveer43/VeloxQuant-MLX"
Repository       = "https://github.com/rajveer43/VeloxQuant-MLX"
"Bug Tracker" = "https://github.com/rajveer43/VeloxQuant-MLX/issues"
Author        = "https://github.com/rajveer43"
Changelog     = "https://github.com/rajveer43/VeloxQuant-MLX/blob/master/CHANGELOG.md"
Documentation = "https://github.com/rajveer43/VeloxQuant-MLX#readme"

[project.scripts]
veloxquant = "veloxquant_mlx.__main__:main"
mlx-kv-quant = "veloxquant_mlx.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["veloxquant_mlx*"]

[tool.pytest.ini_options]
testpaths = ["veloxquant_mlx/tests"]
addopts = "-v"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true

[tool.semantic_release]
version_toml = ["pyproject.toml:project.version"]
version_variables = ["veloxquant_mlx/__init__.py:__version__"]
# Empty string, not `false`: python-semantic-release >=10 validates this as a
# string, and a bool raises a pydantic error that `semantic-release version
# --print` reports on stderr. The release workflow swallows that stderr and
# falls back to an empty version, so the bad value made every run silently
# take the "No release needed" branch instead of failing loudly.
build_command = ""
commit_parser = "conventional"
commit_message = "chore(release): {version} [skip ci]"
tag_format = "v{version}"
# Both are required to stay on 0.x. `major_on_zero = false` alone only stops a
# *breaking change* from forcing 1.0.0; without `allow_zero_version` PSR still
# graduates the project to 1.0.0 on the next release.
major_on_zero = false
allow_zero_version = true

[tool.semantic_release.branches.main]
match = "master"

[tool.semantic_release.changelog]
changelog_file = "CHANGELOG.md"
exclude_commit_patterns = [
    "^chore\\(release\\):",
]

[tool.semantic_release.changelog.default_templates]
changelog_file = "CHANGELOG.md"

[tool.semantic_release.commit_parser_options]
allowed_tags = ["feat", "fix", "perf", "refactor", "docs", "chore", "test", "build", "ci", "style"]
minor_tags = ["feat"]
patch_tags = ["fix", "perf"]
