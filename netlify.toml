[build]
  base    = "/"
  # Only build/deploy when a PR or push actually touches the landing page or
  # docs site. Without this, Netlify runs its (multi-minute, npm-install-heavy)
  # build on every PR, including ones that only touch veloxquant_mlx/ Python
  # source with nothing under landing/ or docs-site/ changed.
  #
  # Netlify's convention for `ignore`: exit 0 => SKIP the build, exit 1 =>
  # proceed. `git diff --quiet` itself exits 1 when there IS a diff and 0
  # when there ISN'T, so it's inverted with `!` to match what we want here:
  # skip (exit 0) when nothing relevant changed, build (exit 1) when it did.
  ignore = "! git diff --quiet HEAD^ HEAD -- landing docs-site netlify.toml"
  command = """
    cd docs-site && npm install && npm run build && cd .. &&
    mkdir -p dist/docs &&
    cp -r docs-site/build/* dist/docs/ &&
    cp -r landing/* dist/ &&
    npx -y csso-cli dist/assets/styles.css -o dist/assets/styles.css &&
    npx -y terser dist/assets/main.js -c -m -o dist/assets/main.js &&
    npx -y terser dist/assets/calc.js -c -m -o dist/assets/calc.js &&
    npx -y terser dist/assets/playground.js -c -m -o dist/assets/playground.js
  """
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  SECRETS_SCAN_OMIT_KEYS = "ALGOLIA_APP_ID,ALGOLIA_SEARCH_API_KEY"

# Long-lived caching for hashed/static assets improves LCP (a Core Web
# Vitals signal Google uses for ranking). HTML is left uncached so
# deploys show up immediately.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/docs/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "*.woff2"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Docs live under /docs/ (docusaurus.config.ts sets baseUrl: '/docs/', and the
# build above copies docs-site/build/* into dist/docs/). Anything that lands on
# a docs path without that prefix hits Netlify's bare 404 page rather than the
# site's own, because the request never reaches the Docusaurus app.
#
# Two ways readers get there: links written before the /docs prefix existed
# (older blog posts and external articles still carry them), and hand-typed
# guesses like /installation. Both are cheap to redirect and confusing to leave
# 404ing, since the bare Netlify 404 gives no way back into the site.
#
# These are non-forced rules (Netlify's default), so a real file at the path
# always wins -- /docs/* keeps serving the built site untouched.

[[redirects]]
  from = "/getting-started/*"
  to = "/docs/getting-started/:splat"
  status = 301

[[redirects]]
  from = "/algorithms/*"
  to = "/docs/algorithms/:splat"
  status = 301

[[redirects]]
  from = "/guides/*"
  to = "/docs/guides/:splat"
  status = 301

[[redirects]]
  from = "/api/*"
  to = "/docs/api/:splat"
  status = 301

# Bare shorthands people type or link by hand.
[[redirects]]
  from = "/installation"
  to = "/docs/getting-started/installation"
  status = 301

[[redirects]]
  from = "/docs/installation"
  to = "/docs/getting-started/installation"
  status = 301

[[redirects]]
  from = "/quickstart"
  to = "/docs/getting-started/quickstart"
  status = 301

[[redirects]]
  from = "/changelog"
  to = "/docs/changelog"
  status = 301
