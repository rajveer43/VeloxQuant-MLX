name: release

# Automatic version bump on merge to master, driven by Conventional Commits
# (see CONTRIBUTING.md "Commit conventions"). python-semantic-release parses
# commits since the last tag to decide whether a release is warranted and
# at what semver level (feat -> minor, fix/perf -> patch, feat!/BREAKING
# CHANGE -> major bump-of-minor while major_on_zero=false in pyproject.toml).
#
# Runs on macOS because `mlx` (this package's core dependency) only installs
# on Apple Silicon -- a release gate that cannot import the package it is
# releasing is not a real gate. This is more expensive per-minute than an
# ubuntu runner; that cost is accepted deliberately here.
#
# The bump commit is tagged `chore(release): ... [skip ci]` so it does not
# retrigger this same workflow.

on:
  push:
    branches: [master]
    # Belt-and-suspenders alongside the commit-type discipline in
    # CONTRIBUTING.md ("Commit conventions"): PSR bumps purely on commit
    # *type* (feat/fix/perf), not on which files changed, so a landing-only
    # push typed as feat(landing)/fix(landing) still bumps the Python
    # package version and republishes to PyPI with zero package changes.
    # This only skips the run when EVERY changed file matches below -- a
    # push that also touches veloxquant_mlx/** still runs normally and
    # still syncs landing/index.html via scripts/sync_release_badges.py.
    paths-ignore:
      - 'landing/**'
      - 'docs/**'
      - '**.md'

# `cancel-in-progress: false` is deliberate and must stay that way: this job
# pushes a tag, publishes a GitHub Release, and uploads to PyPI. Cancelling it
# midway could leave a tag pushed with nothing published, or a PyPI upload with
# no matching tag. A queued run is always safer than a half-finished release.
#
# The cost of queueing is that a burst of merges (Dependabot lands several PRs
# in a row) queues one macos-14 release run each, all starting within seconds.
# On 2026-08-17 that burst hit a codeload.github.com 429 and two release runs
# died downloading actions/checkout before any step ran, which is why 0.50.0
# was tagged but never reached PyPI. `debounce` below collapses such a burst
# into a single release instead of widening this window.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Cheap ubuntu gate that runs before the macos-14 release job. Its only
  # purpose is to let a burst of merges collapse into one release: it waits
  # briefly, then drops out if a newer commit has already landed on master,
  # so only the last push in the burst proceeds to actually release. Whatever
  # that final run releases includes every commit in the burst -- semantic
  # release reads all commits since the last tag, so nothing is skipped.
  #
  # This uses no actions at all (no checkout, no setup-python) precisely
  # because the failure it mitigates was an action *download* being rate
  # limited before any step could run.
  debounce:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Wait out any in-flight burst of merges
        run: sleep 60

      - name: Release only if this is still the newest commit on master
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          head_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/master" --jq '.sha')
          if [ "$head_sha" = "${GITHUB_SHA}" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "This is master HEAD -- proceeding to release."
          else
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "Superseded by ${head_sha} -- that run will release this commit too."
          fi

  release:
    needs: debounce
    if: needs.debounce.outputs.proceed == 'true'
    runs-on: macos-14
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package + dev/release dependencies
        run: |
          pip install -e ".[dev]"

      - name: Run test suite (release gate)
        run: python -m pytest veloxquant_mlx/tests -q

      - name: Configure git identity for the release commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine next version (dry run)
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Do NOT discard stderr or swallow the exit code here. PSR exits 2
          # with "no release will be made" when there is genuinely nothing to
          # release, but exits non-zero for config/parse errors too. Treating
          # every failure as "no release" is how a `build_command = false`
          # config error silently skipped four releases (0.41.0 -> 0.42.0).
          set +e
          NEXT_VERSION="$(semantic-release version --print 2>version_err.txt)"
          STATUS=$?
          set -e
          cat version_err.txt

          if [ "$STATUS" -ne 0 ] && ! grep -qi "no release will be made" version_err.txt; then
            echo "::error::semantic-release failed to compute a version (exit ${STATUS}). See stderr above."
            exit 1
          fi

          # "No release will be made" still prints the *current* (unchanged)
          # version to stdout, not an empty string -- e.g. "0.43.6" when
          # 0.43.6 was already released and nothing since qualifies (a
          # docs-only merge landing right after a real release). Treating
          # that as next_version made every downstream step run again for
          # a version that was never actually bumped: "Commit, tag, and
          # push" found nothing staged (README/CHANGELOG/pyproject.toml
          # were already at that version) and failed on an empty commit.
          if grep -qi "no release will be made" version_err.txt; then
            NEXT_VERSION=""
          fi

          echo "next_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: No release needed
        if: steps.version.outputs.next_version == ''
        run: echo "No releasable commits since the last tag (docs/chore/test-only). Skipping."

      - name: Bump pyproject.toml/__init__.py and prepend CHANGELOG entry (no commit yet)
        if: steps.version.outputs.next_version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release version --no-commit --no-tag --no-push --no-vcs-release

      - name: Sync README badges + landing page (version + live test count)
        if: steps.version.outputs.next_version != ''
        run: python scripts/sync_release_badges.py

      - name: Commit, tag, and push the release
        if: steps.version.outputs.next_version != ''
        run: |
          # landing/index.html is included because sync_release_badges.py rewrites
          # the hero badge version and the meta-description/test-count claims
          # there; omitting it would silently discard that sync every release.
          git add pyproject.toml veloxquant_mlx/__init__.py CHANGELOG.md README.md \
                  landing/index.html
          git commit -m "chore(release): ${{ steps.version.outputs.next_version }} [skip ci]"
          # Annotated (-a), not lightweight: `git push --follow-tags` pushes ONLY
          # annotated tags, so a lightweight tag here is created locally on the
          # runner and then silently dropped -- the branch lands but the tag never
          # reaches the remote, and `semantic-release publish` finds nothing to
          # publish and exits 0. That is exactly how v0.42.0 shipped untagged.
          git tag -a "v${{ steps.version.outputs.next_version }}" \
                  -m "v${{ steps.version.outputs.next_version }}"
          git push origin master
          # Push the tag explicitly rather than relying on --follow-tags, and fail
          # the job if it does not land, so a missing tag can never be silent again.
          git push origin "v${{ steps.version.outputs.next_version }}"

      - name: Publish GitHub Release
        if: steps.version.outputs.next_version != ''
        run: |
          # `semantic-release publish` does NOT create a GitHub Release --
          # it only uploads build artifacts to one that already exists. With
          # --no-vcs-release on the bump step (deliberate: this workflow tags
          # and pushes manually, see the step above), nothing ever created
          # the release itself, so `publish` logged "No release corresponds
          # to tag ..., can't upload dists" and exited 0 -- a silent no-op
          # that looked like success. Create the release directly instead,
          # extracting this version's section from CHANGELOG.md for the
          # release notes (the same content `semantic-release version` just
          # prepended there).
          # semantic-release's auto-generated heading is "## v<version> (<date>)"
          # (no brackets) -- distinct from this file's older hand-written
          # "## [<version>] — <date>" entries. Match either so a future
          # switch back to hand-editing doesn't silently break this again.
          VERSION="${{ steps.version.outputs.next_version }}"
          awk -v v1="## v${VERSION} " -v v2="## [${VERSION}]" '
            (index($0, v1) == 1 || index($0, v2) == 1) { found=1; print; next }
            found && index($0, "## ") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "::warning::No CHANGELOG.md section found for v${VERSION}; publishing release with an empty body."
          fi

          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build sdist + wheel
        if: steps.version.outputs.next_version != ''
        run: |
          python -m pip install --upgrade build
          python -m build
          ls -la dist/

      - name: Upload dist/ for the publish jobs
        if: steps.version.outputs.next_version != ''
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: dist/
          retention-days: 7

    outputs:
      # Empty when the "release" job's own `if:` skips it entirely (a
      # [skip ci] push) or when it ran but found no releasable commits --
      # either way, both publish jobs below no-op via their own `if:`.
      next_version: ${{ steps.version.outputs.next_version }}

  # Trusted Publishing (OIDC): no PyPI/TestPyPI API token is stored anywhere
  # in this repo. Each job below authenticates via a short-lived OIDC token
  # GitHub mints for the run, which PyPI/TestPyPI trust because this
  # repo+workflow+environment combination was registered as a trusted
  # publisher on each index ahead of time (pypi.org / test.pypi.org ->
  # project -> Publishing -> Add a new publisher). The `environment:` name
  # here must exactly match what was registered there.
  publish-testpypi:
    needs: release
    if: needs.release.outputs.next_version != ''
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/VeloxQuant-MLX
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI is a shared, non-authoritative sandbox that does not
          # get wiped per-release -- a version collision there (e.g. a
          # manual test upload of the same version) should not block the
          # real PyPI publish below.
          skip-existing: true

  # Real PyPI. Gated on TestPyPI succeeding first (needs: includes
  # publish-testpypi) -- this is the "test run before the real release"
  # requested. No skip-existing here: a collision on real PyPI means
  # something is wrong (e.g. this version was already published by a
  # different run) and should fail loudly, not silently no-op.
  publish-pypi:
    needs: [release, publish-testpypi]
    if: needs.release.outputs.next_version != ''
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/VeloxQuant-MLX
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
