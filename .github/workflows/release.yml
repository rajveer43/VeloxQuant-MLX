name: release

# Weekly release, driven by Conventional Commits (see CONTRIBUTING.md
# "Commit conventions" and "Releases"). Merging a PR does NOT publish
# anything: once a week (Sunday 10:00 IST = 04:30 UTC) this workflow runs on
# master HEAD,
# and python-semantic-release reads every commit since the last tag and takes
# the highest bump among them (feat -> minor, fix/perf -> patch,
# feat!/BREAKING CHANGE -> major bump-of-minor while major_on_zero=false in
# pyproject.toml). A week with three `fix:` and one `feat:` therefore yields a
# single minor release with one CHANGELOG section and one GitHub Release.
#
# A week ends green with no tag and no upload when either
#   * nothing under veloxquant_mlx/** or pyproject.toml changed since the last
#     tag (so a `feat(landing): ...` typed commit cannot republish the
#     package), or
#   * python-semantic-release finds no releasable commit (docs/chore/test-only).
#
# Merge cutoff: Saturday 18:00 IST (12:30 UTC). PRs should be merged before
# it; anything merged after it is flagged in the run summary (and as a
# warning) so the maintainer can see exactly what slipped into the release.
# The cutoff is a convention with visibility, not a hard freeze: the release
# still ships master HEAD.
#
# Manual runs (workflow_dispatch, write access required):
#   * dry_run=true  -> computes the next version and prints the release notes
#                      in the run summary; never tags, pushes or publishes and
#                      skips the (macOS-minutes-expensive) test suite.
#   * dry_run=false -> cuts a release immediately. This is the hotfix path;
#                      see CONTRIBUTING.md "Releases" for when it is
#                      appropriate. Only runs from master.
# Re-running is safe: the next version is derived from commits since the last
# tag, so once a release has been tagged a re-run finds nothing new and does
# not tag again. If a previous run tagged but failed before PyPI, a re-run
# detects that the tag is missing from PyPI and publishes it from the tagged
# source; PyPI rejects duplicate versions, so nothing is uploaded twice.
#
# Runs on macOS because `mlx` (this package's core dependency) only installs
# on Apple Silicon -- a release gate that cannot import the package it is
# releasing is not a real gate. This is more expensive per-minute than an
# ubuntu runner; that cost is accepted deliberately here.
#
# A failed scheduled run shows up red in the Actions tab and GitHub emails the
# user who last edited the `cron` line below.
#
# The bump commit is tagged `chore(release): ... [skip ci]` so it does not
# retrigger other push-based workflows.

on:
  schedule:
    # Sunday 10:00 IST (04:30 UTC; India has no DST, so this never shifts).
    # Scheduled runs can start late under GitHub load.
    - cron: "30 4 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Compute the next version and release notes, but do not tag or publish"
        type: boolean
        default: false

# `cancel-in-progress: false` is deliberate and must stay that way: this job
# pushes a tag, publishes a GitHub Release, and uploads to PyPI. Cancelling it
# midway could leave a tag pushed with nothing published, or a PyPI upload with
# no matching tag. A queued run is always safer than a half-finished release.
#
# History: when this ran on every push to master, a burst of Dependabot merges
# on 2026-08-17 hit a codeload.github.com 429 and 0.50.0 was tagged but never
# reached PyPI. A single weekly run cannot burst, so the old `debounce` job is
# gone.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Releases are cut from master only, even for a manual dispatch.
    if: github.ref == 'refs/heads/master'
    runs-on: macos-15
    permissions:
      contents: write
    env:
      # 'true' only for a manual dispatch with dry_run ticked.
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install package + test/release dependencies
        run: |
          pip install -e ".[test,release]"

      - name: Check that the latest tag reached PyPI
        id: recover
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # A run can fail after pushing the tag but before PyPI (this is how
          # 0.50.0 was tagged and never published). Re-running cannot fix that
          # on its own: the next version is derived from commits since the last
          # tag, so a re-run finds nothing new. Detect it here and republish
          # the tagged source. PyPI rejects duplicate versions, so this can
          # never double-upload.
          echo "needed=false" >> "$GITHUB_OUTPUT"
          if ! LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null)"; then
            exit 0
          fi
          echo "tag=${LAST_TAG}" >> "$GITHUB_OUTPUT"
          CODE="$(curl -s -o /dev/null -w '%{http_code}' --retry 3 --retry-all-errors \
            "https://pypi.org/pypi/VeloxQuant-MLX/${LAST_TAG#v}/json")"
          case "${CODE}" in
            200) echo "${LAST_TAG} is on PyPI." ;;
            404)
              echo "needed=true" >> "$GITHUB_OUTPUT"
              echo "::warning::${LAST_TAG} is tagged but missing from PyPI."
              echo "### ${LAST_TAG} is tagged but missing from PyPI" >> "$GITHUB_STEP_SUMMARY"
              if [ "${DRY_RUN}" = "true" ]; then
                echo "A non-dry run will rebuild it from the tag and publish it." >> "$GITHUB_STEP_SUMMARY"
              fi
              ;;
            *)
              echo "::error::Could not determine whether ${LAST_TAG} is on PyPI (HTTP ${CODE})."
              exit 1
              ;;
          esac

      - name: Rebuild the unpublished tag and publish its GitHub Release
        if: steps.recover.outputs.needed == 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Build from the tag itself, not master HEAD. The tag already passed
          # the test gate when it was created, so the gate is not repeated.
          TAG="${{ steps.recover.outputs.tag }}"
          git worktree add "${RUNNER_TEMP}/recover-src" "${TAG}"
          python -m pip install --upgrade build
          python -m build --outdir "${GITHUB_WORKSPACE}/dist" "${RUNNER_TEMP}/recover-src"
          ls -la dist/
          if ! gh release view "${TAG}" >/dev/null 2>&1; then
            scripts/extract_release_notes.sh "${TAG#v}" "${RUNNER_TEMP}/recover-src/CHANGELOG.md" > recover_notes.md
            gh release create "${TAG}" --title "${TAG}" --notes-file recover_notes.md
          fi

      - name: Check whether the package changed since the last tag
        id: changed
        run: |
          # PSR bumps on commit *type*, not on which files changed, so a
          # `feat(landing): ...` commit would republish an unchanged package.
          # Only release when the shipped package or its metadata changed.
          # The release commit itself is the tagged commit, so it is not
          # counted against the next release.
          if LAST_TAG="$(git describe --tags --abbrev=0 2>/dev/null)"; then
            if git diff --quiet "${LAST_TAG}..HEAD" -- veloxquant_mlx pyproject.toml; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              echo "Nothing under veloxquant_mlx/ or pyproject.toml changed since ${LAST_TAG}."
            else
              echo "changed=true" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "No previous tag found -- treating the package as changed."
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Flag commits merged after the Saturday 18:00 IST cutoff
        if: github.event_name == 'schedule' || env.DRY_RUN == 'true'
        run: |
          # Most recent Saturday 12:30 UTC (= 18:00 IST) before this run.
          CUTOFF="$(date -u -v-sat -v12H -v30M -v0S +%Y-%m-%dT%H:%M:%SZ)"
          LATE="$(git log --since="${CUTOFF}" --format='- %h %s (%cI)' HEAD)"
          if [ -n "${LATE}" ]; then
            echo "::warning::Commits merged after the ${CUTOFF} cutoff are included in this release."
            {
              echo "### Merged after the merge cutoff (${CUTOFF})"
              echo "${LATE}"
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No commits after the ${CUTOFF} cutoff."
          fi

      - name: Determine next version
        id: version
        if: steps.changed.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Do NOT discard stderr or swallow the exit code here. PSR exits 2
          # with "no release will be made" when there is genuinely nothing to
          # release, but exits non-zero for config/parse errors too. Treating
          # every failure as "no release" is how a `build_command = false`
          # config error silently skipped four releases (0.41.0 -> 0.42.0).
          set +e
          NEXT_VERSION="$(semantic-release version --print 2>version_err.txt)"
          STATUS=$?
          set -e
          cat version_err.txt

          if [ "$STATUS" -ne 0 ] && ! grep -qi "no release will be made" version_err.txt; then
            echo "::error::semantic-release failed to compute a version (exit ${STATUS}). See stderr above."
            exit 1
          fi

          # "No release will be made" still prints the *current* (unchanged)
          # version to stdout, not an empty string -- e.g. "0.43.6" when
          # 0.43.6 was already released and nothing since qualifies (a
          # docs-only merge landing right after a real release). Treating
          # that as next_version made every downstream step run again for
          # a version that was never actually bumped: "Commit, tag, and
          # push" found nothing staged (README/CHANGELOG/pyproject.toml
          # were already at that version) and failed on an empty commit.
          if grep -qi "no release will be made" version_err.txt; then
            NEXT_VERSION=""
          fi

          echo "next_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: No release needed
        if: steps.version.outputs.next_version == ''
        run: |
          echo "No release needed: either the package did not change since the last tag or no commit since then is releasable (docs/chore/test-only). No tag, no upload."
          echo "### No release needed" >> "$GITHUB_STEP_SUMMARY"

      - name: Run test suite (release gate)
        if: steps.version.outputs.next_version != '' && env.DRY_RUN != 'true'
        run: python -m pytest veloxquant_mlx/tests -q

      - name: Configure git identity for the release commit
        if: steps.version.outputs.next_version != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump pyproject.toml/__init__.py and prepend CHANGELOG entry (no commit yet)
        if: steps.version.outputs.next_version != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: semantic-release version --no-commit --no-tag --no-push --no-vcs-release

      - name: Sync README badges + landing page (version + live test count)
        if: steps.version.outputs.next_version != ''
        run: python scripts/sync_release_badges.py

      - name: Extract release notes from CHANGELOG
        if: steps.version.outputs.next_version != ''
        run: |
          # Pull this version's section out of CHANGELOG.md (the same content
          # `semantic-release version` just prepended there). Used for the
          # GitHub Release body and, on a dry run, for the run summary.
          VERSION="${{ steps.version.outputs.next_version }}"
          scripts/extract_release_notes.sh "${VERSION}" > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "::warning::No CHANGELOG.md section found for v${VERSION}; the release body will be empty."
          fi

          {
            if [ "$DRY_RUN" = "true" ]; then
              echo "### Dry run: would release v${VERSION}"
              echo "Nothing was tagged, pushed or published."
            else
              echo "### Releasing v${VERSION}"
            fi
            echo
            cat release_notes.md
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Commit, tag, and push the release
        if: steps.version.outputs.next_version != '' && env.DRY_RUN != 'true'
        run: |
          # landing/index.html is included because sync_release_badges.py rewrites
          # the hero badge version and the meta-description/test-count claims
          # there; omitting it would silently discard that sync every release.
          # landing/sitemap.xml is included for the same reason: the sync bumps
          # the home page's <lastmod>.
          git add pyproject.toml veloxquant_mlx/__init__.py CHANGELOG.md README.md \
                  landing/index.html landing/sitemap.xml
          git commit -m "chore(release): ${{ steps.version.outputs.next_version }} [skip ci]"
          # Annotated (-a), not lightweight: `git push --follow-tags` pushes ONLY
          # annotated tags, so a lightweight tag here is created locally on the
          # runner and then silently dropped -- the branch lands but the tag never
          # reaches the remote, and `semantic-release publish` finds nothing to
          # publish and exits 0. That is exactly how v0.42.0 shipped untagged.
          git tag -a "v${{ steps.version.outputs.next_version }}" \
                  -m "v${{ steps.version.outputs.next_version }}"
          git push origin master
          # Push the tag explicitly rather than relying on --follow-tags, and fail
          # the job if it does not land, so a missing tag can never be silent again.
          git push origin "v${{ steps.version.outputs.next_version }}"

      - name: Publish GitHub Release
        if: steps.version.outputs.next_version != '' && env.DRY_RUN != 'true'
        run: |
          # `semantic-release publish` does NOT create a GitHub Release --
          # it only uploads build artifacts to one that already exists. With
          # --no-vcs-release on the bump step (deliberate: this workflow tags
          # and pushes manually, see the step above), nothing ever created
          # the release itself, so `publish` logged "No release corresponds
          # to tag ..., can't upload dists" and exited 0 -- a silent no-op
          # that looked like success. Create the release directly instead,
          # using the notes extracted above.
          VERSION="${{ steps.version.outputs.next_version }}"
          gh release create "v${VERSION}" \
            --title "v${VERSION}" \
            --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build sdist + wheel
        if: steps.version.outputs.next_version != '' && env.DRY_RUN != 'true'
        run: |
          python -m pip install --upgrade build
          python -m build
          ls -la dist/

      - name: Upload dist/ for the publish jobs
        if: (steps.version.outputs.next_version != '' || steps.recover.outputs.needed == 'true') && env.DRY_RUN != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-dist
          path: dist/
          retention-days: 7

      - name: Tell the publish jobs there is something to publish
        id: publish_flag
        if: (steps.version.outputs.next_version != '' || steps.recover.outputs.needed == 'true') && env.DRY_RUN != 'true'
        run: echo "publish=true" >> "$GITHUB_OUTPUT"

    outputs:
      # Empty on a no-release week, on a dry run, or when the package did not
      # change -- every case in which both publish jobs below must no-op via
      # their own `if:`. 'true' for a new release or a recovered unpublished
      # tag (dist/ then holds the artifacts to upload).
      publish: ${{ steps.publish_flag.outputs.publish }}

  # Trusted Publishing (OIDC): no PyPI/TestPyPI API token is stored anywhere
  # in this repo. Each job below authenticates via a short-lived OIDC token
  # GitHub mints for the run, which PyPI/TestPyPI trust because this
  # repo+workflow+environment combination was registered as a trusted
  # publisher on each index ahead of time (pypi.org / test.pypi.org ->
  # project -> Publishing -> Add a new publisher). The `environment:` name
  # here must exactly match what was registered there.
  publish-testpypi:
    needs: release
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/VeloxQuant-MLX
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist/

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3 (release/v1)
        with:
          repository-url: https://test.pypi.org/legacy/
          # TestPyPI is a shared, non-authoritative sandbox that does not
          # get wiped per-release -- a version collision there (e.g. a
          # manual test upload of the same version) should not block the
          # real PyPI publish below.
          skip-existing: true

  # Real PyPI. Gated on TestPyPI succeeding first (needs: includes
  # publish-testpypi) -- this is the "test run before the real release"
  # requested. No skip-existing here: a collision on real PyPI means
  # something is wrong (e.g. this version was already published by a
  # different run) and should fail loudly, not silently no-op.
  publish-pypi:
    needs: [release, publish-testpypi]
    if: needs.release.outputs.publish == 'true'
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/VeloxQuant-MLX
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3 (release/v1)
