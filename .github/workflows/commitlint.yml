name: commitlint

# Enforces Conventional Commits on every PR, since the release workflow
# (.github/workflows/release.yml) parses commit prefixes (feat:/fix:/etc.)
# to decide the next version bump. A PR with no conventional commit in it
# would otherwise silently fail to trigger a release later.

on:
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Lint PR commits against Conventional Commits
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6
        with:
          configFile: .commitlintrc.json
          failOnWarnings: false
