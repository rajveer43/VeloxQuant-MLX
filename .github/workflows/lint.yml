name: lint

# ruff-format enforces the current repo-wide formatting baseline and blocks
# the PR on failure.
#
# ruff-check and mypy are reporting-only (continue-on-error: true) for now.
# As of #422, `ruff check .` has 528 pre-existing violations and `mypy
# veloxquant_mlx` has 715, both predating this job -- see #40 for the
# original ruff-check gap. Making either blocking today would fail every PR
# regardless of what it touches. They stay wired into CI so regressions are
# at least visible (green/red on the job, not silence), while the actual
# backlog is worked down in dedicated cleanup PRs. Once a rule group's
# backlog is cleared, drop its `continue-on-error` (or, for ruff, fold it
# into `pre-commit run --all-files` so CI and the local hook enforce the
# same thing).

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ruff-format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check formatting with ruff
        run: pipx run ruff format --check .

  ruff-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Lint with ruff (non-blocking until the pre-existing backlog is cleared)
        continue-on-error: true
        run: pipx run ruff check .

  mypy:
    # macos-14, not ubuntu-latest: `pip install -e ".[dev]"` pulls in the
    # `mlx`/`mlx-lm` core dependencies, which ship no Linux wheels at all
    # (see docs/CI_AND_TESTING.md) -- the same reason mlx-tests.yml runs on
    # this same runner image.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package + dev dependencies
        run: pip install -e ".[dev]"
      - name: Type check with mypy (non-blocking until the pre-existing backlog is cleared)
        continue-on-error: true
        run: mypy veloxquant_mlx
