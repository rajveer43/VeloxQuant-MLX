name: copyright-watch

# Searches GitHub's public code index for distinctive strings from this repo
# (class names, package names, unique identifiers). If anyone has copied the
# code into their own repo without attribution, the workflow fails, which:
#   1. Sends a direct email via Resend to rathodrajveer1311@gmail.com, and
#   2. Triggers GitHub's own workflow-failure notification (per your
#      notification settings at https://github.com/settings/notifications)
#      as a backup channel.
#
# Setup required: add a RESEND_API_KEY repo secret (Settings > Secrets and
# variables > Actions). Get a free key at https://resend.com — the sandbox
# sender (onboarding@resend.dev) can email your own verified address with
# no domain setup needed.
#
# Watch list: every KVCache/Cache class under veloxquant_mlx/cache/ (43 as of
# writing), generated from source on each run -- not hand-maintained, so a
# newly added method is covered automatically. See the in-step comment for
# how false positives from paper-name classes (H2OKVCache, TOVAKVCache, etc.
# -- independently reused by unrelated projects) are filtered out.
#
# Limitations:
#   - Only indexes PUBLIC GitHub repos (no GitLab, Bitbucket, private mirrors).
#   - Search has a few-day indexing lag for new repos.
#   - Forks of THIS repo are excluded automatically by the -repo: filter,
#     so legitimate forks (which preserve the LICENSE) won't trigger alerts.
#   - Won't catch a copy that renames all identifiers before redistributing.
#   - Only watches veloxquant_mlx/cache/ classes plus a couple of hand-picked
#     non-class identifiers -- a copy of only quantizer/allocator/CLI code
#     with the cache layer stripped out would not be caught.

on:
  schedule:
    # Every Monday at 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:   # allow manual runs from the Actions tab

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    # ~45 queries * 20s apart is ~15min baseline, but a secondary rate-limit
    # cooldown has been observed up to ~175s on a single query with no
    # retry cap (see in-step comment) -- this is a background weekly cron,
    # not something anyone waits on, so generous headroom costs nothing.
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify RESEND_API_KEY is configured
        # Fail fast, before burning the ~45-query / up-to-90-minute search
        # budget below, if the secret this workflow depends on for its only
        # notification channel (see the module comment) isn't set. A search
        # that finds a hit but then can't send the alert email fails opaquely
        # at the "Email alert via Resend" step with a bare `curl` 401 -- this
        # step instead fails immediately with a message that says exactly
        # what's missing and where to fix it. #476
        run: |
          if [ -z "${{ secrets.RESEND_API_KEY }}" ]; then
            echo "::error::RESEND_API_KEY secret is not set — skipping copyright watch this run. See .github/workflows/copyright-watch.yml for setup (Settings > Secrets and variables > Actions > RESEND_API_KEY)."
            exit 1
          fi

      - name: Search for unauthorized copies
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            // Query list is generated from source every run instead of a
            // hand-maintained list, so a newly added cache method (there
            // are 43 as of this writing, one per veloxquant_mlx/cache/*.py
            // file) is watched automatically -- nothing to remember to add.
            //
            // We deliberately do NOT search for the generic strings
            // "mlx_kv_quant" or "VeloxQuant-MLX" — those have high
            // false-positive rates because they appear in PyPI metadata
            // mirrors (e.g. szabgab/pydigger-data), AI-assistant transcripts,
            // and legitimate downstream users' install scripts.
            //
            // Class names split into two tiers, because most of them are
            // this repo's spelling of a *paper's own* method name, not a
            // VeloxQuant-MLX coinage -- e.g. "TurboQuantKVCache" (dropped
            // from here previously) matches 1000+ hits including files
            // literally named TurboQuantKVCache.swift / turboquant_cache.py
            // in ml-explore/mlx-swift-lm and pytorch/executorch, and the
            // same is true of "H2OKVCache" (130 hits, incl. independent
            // paper reimplementations) and "SlidingWindowKVCache" (188
            // hits, incl. apple/axlearn) -- other projects independently
            // landing on the obvious name for a published technique, not
            // copies of this code.
            //   - BRANDED: class name contains one of this project's own
            //     coinages (TurboQuant, VecInfer, RateQuant, ...). These
            //     are searched standalone -- verified low-noise.
            //   - GENERIC: everything else (H2OKVCache, TOVAKVCache, ...).
            //     Searched combined with the class's own source filename
            //     (e.g. "H2OKVCache" "h2o_cache.py"), since an independent
            //     reimplementation won't also happen to use this repo's
            //     internal module filename. Verified this collapses
            //     H2OKVCache from 130 hits to 9 (all this repo) and
            //     SlidingWindowKVCache from 188 to 1 (this repo only).
            const SELF = 'rajveer43/VeloxQuant-MLX';
            const BRAND_MARKERS = ['turboquant', 'vecinfer', 'ratequant'];
            // Confirmed too generic DESPITE containing a brand marker --
            // "TurboQuantKVCache" is this repo's name for the *baseline*
            // TurboQuant paper method (as opposed to TurboQuantRVQKVCache,
            // its own extension), and other projects independently landed
            // on the identical name for the identical paper technique (see
            // the 1000+-hit false positive documented below). Force these
            // through the filename-combined (GENERIC) path regardless of
            // the brand check.
            const FORCE_GENERIC = new Set(['TurboQuantKVCache']);

            const cacheDir = 'veloxquant_mlx/cache';
            const classPattern = /^class\s+([A-Za-z0-9_]+(?:KVCache|Cache))\b/;
            const queries = [];

            for (const file of fs.readdirSync(cacheDir)) {
              if (!file.endsWith('.py')) continue;
              const text = fs.readFileSync(path.join(cacheDir, file), 'utf8');
              for (const line of text.split('\n')) {
                const m = line.match(classPattern);
                if (!m) continue;
                const className = m[1];
                const isBranded =
                  !FORCE_GENERIC.has(className) &&
                  BRAND_MARKERS.some(b => className.toLowerCase().includes(b));
                const q = isBranded
                  ? `"${className}" -repo:${SELF}`
                  : `"${className}" "${file}" -repo:${SELF}`;
                queries.push(q);
              }
            }

            // A few additional distinctive, non-class identifiers kept from
            // the original hand-picked list -- confirmed unique to this repo.
            queries.push(`"_rvq_quality_synthetic" -repo:${SELF}`);
            queries.push(`"allocate_bits_ratequant" -repo:${SELF}`);

            core.info(`Generated ${queries.length} watch queries from ${cacheDir}`);

            // The default GITHUB_TOKEN hits GitHub's search secondary rate
            // limit ("abuse detection") on back-to-back code-search calls.
            // At low query counts (4-5) a fixed 20s gap and a few fixed-size
            // retries cleared it. At the full 45-query sweep it does not:
            // GitHub's cooldown escalates with sustained traffic -- one run
            // saw "try again in 173.47s" while a fixed 10/20/30s retry
            // ladder only waited 60s total before giving up, so every retry
            // just got rejected again. Fix: parse GitHub's own quoted
            // wait time out of the error and sleep exactly that long (plus
            // a small margin), rather than guessing at a backoff schedule.
            // No retry cap -- honoring the real cooldown either clears it
            // or the job's own 30min timeout ends things, which is a more
            // honest failure than silently skipping queries.
            function rateLimitWaitMs(e) {
              const isRateLimited =
                e.status === 403 ||
                e.status === 429 ||
                /rate limit|abuse/i.test(e.message || '');
              if (!isRateLimited) return null;
              const m = /try again in ([\d.]+)s/i.exec(e.message || '');
              // +5s margin: GitHub's own countdown is exact to the second,
              // but the clock starts back at the moment the 403 was raised.
              return m ? Math.ceil(parseFloat(m[1]) * 1000) + 5000 : 30000;
            }

            async function searchWithRetry(q) {
              for (;;) {
                try {
                  return await github.rest.search.code({ q, per_page: 10 });
                } catch (e) {
                  const waitMs = rateLimitWaitMs(e);
                  if (waitMs === null) throw e;
                  core.info(
                    `Query "${q}" rate-limited, waiting ${Math.round(waitMs / 1000)}s (GitHub's own cooldown) before retrying...`
                  );
                  await new Promise(r => setTimeout(r, waitMs));
                }
              }
            }

            let total_hits = 0;
            const findings = [];

            for (const q of queries) {
              try {
                const r = await searchWithRetry(q);
                if (r.data.total_count > 0) {
                  total_hits += r.data.total_count;
                  const repos = [...new Set(r.data.items.map(
                    i => i.repository.full_name
                  ))];
                  findings.push({
                    query: q,
                    count: r.data.total_count,
                    repos,
                  });
                  core.warning(
                    `Query "${q}" → ${r.data.total_count} hit(s) in: ${repos.join(', ')}`
                  );
                }
                // GitHub code-search rate limit: 10 req/min. 20s between
                // queries stays under that on its own merits; the retry
                // loop above is what actually absorbs secondary-limit
                // cooldowns when they happen.
                await new Promise(r => setTimeout(r, 20000));
              } catch (e) {
                core.warning(`Query failed: ${q} — ${e.message}`);
              }
            }

            if (total_hits > 0) {
              const lines = ['# Possible unauthorized copies detected', ''];
              for (const f of findings) {
                lines.push(`## \`${f.query}\``);
                lines.push(`- ${f.count} match(es)`);
                lines.push('- Repos:');
                for (const r of f.repos) {
                  lines.push(`  - https://github.com/${r}`);
                }
                lines.push('');
              }
              await core.summary.addRaw(lines.join('\n')).write();
              core.exportVariable('COPY_WATCH_HITS', String(total_hits));
              core.exportVariable('COPY_WATCH_BODY', lines.join('\n'));
              core.setFailed(
                `Found ${total_hits} potential copies across ` +
                `${findings.length} watched query/queries. ` +
                `See workflow summary for repo links.`
              );
            } else {
              core.info('No unauthorized copies detected.');
            }

      - name: Email alert via Resend
        if: failure() && env.COPY_WATCH_HITS
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_TO: rathodrajveer1311@gmail.com
        run: |
          # Build JSON body safely with jq (avoids shell-escaping the markdown).
          html=$(printf '%s' "$COPY_WATCH_BODY" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g' | sed 's/$/<br>/')
          payload=$(jq -n \
            --arg to "$ALERT_TO" \
            --arg subject "VeloxQuant-MLX copyright-watch: possible unauthorized copy detected" \
            --arg html "<pre>${html}</pre><p>Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}</p>" \
            '{from: "VeloxQuant Copyright Watch <onboarding@resend.dev>", to: [$to], subject: $subject, html: $html}')
          curl -fsS -X POST https://api.resend.com/emails \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "$payload"
