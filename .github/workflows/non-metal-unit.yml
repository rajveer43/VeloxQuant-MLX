name: non-metal-unit

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  recommender:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pytest only
        run: pip install pytest
      # Keep tests under repo-root tests/non_metal/ so pytest does not
      # walk into veloxquant_mlx/ (package __init__ imports mlx). Run the
      # whole directory, not individual files by name -- naming files
      # explicitly is how test_block_pool.py went uncovered for a while
      # despite living right next to test_mac_recommender.py (#425).
      - name: Run non-metal unit tests (no MLX)
        run: >
          python -m pytest tests/non_metal/ -q
          --noconftest --import-mode=importlib -c /dev/null -o addopts=
