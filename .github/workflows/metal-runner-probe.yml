name: metal-runner-probe

# Throwaway diagnostic workflow for issue #395: does a GitHub-hosted macOS
# runner expose a usable Metal device to mlx at all? This does NOT run on
# push/PR -- manual dispatch only, since it exists purely to answer that one
# question before any real CI is built on top of the answer. Delete this
# workflow once #395 reaches a written conclusion (see the issue for the
# three possible outcomes and what happens next for each).

on:
  workflow_dispatch:
    inputs:
      run_metal_tests:
        description: >-
          Also run a small Metal-gated test subset (test_warmup.py,
          test_tova_evict.py) if the availability probe reports Metal
          available. Leave off for just the availability check.
        type: boolean
        default: false

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Show hardware info
        run: |
          sysctl -n machdep.cpu.brand_string || true
          system_profiler SPHardwareDataType || true
          system_profiler SPDisplaysDataType || true

      - name: Install package (pulls mlx + mlx-lm)
        run: pip install -e ".[dev]"

      - name: Probe mx.metal.is_available() and metal_available()
        run: |
          python - <<'PY'
          import mlx.core as mx

          print(f"mlx version: {mx.__version__}" if hasattr(mx, "__version__") else "mlx version: unknown")

          try:
              metal_ok = mx.metal.is_available()
          except Exception as e:
              metal_ok = f"error: {e}"
          print(f"mx.metal.is_available() = {metal_ok}")

          try:
              from veloxquant_mlx.metal import metal_available
              repo_ok = metal_available()
          except Exception as e:
              repo_ok = f"error: {e}"
          print(f"veloxquant_mlx.metal.metal_available() = {repo_ok}")

          try:
              info = mx.metal.device_info()
              print(f"mx.metal.device_info() = {info}")
          except Exception as e:
              print(f"mx.metal.device_info() failed: {e}")
          PY

      - name: Attempt a trivial Metal kernel compile + run
        run: |
          python - <<'PY'
          import mlx.core as mx

          a = mx.random.normal((256, 256))
          b = mx.random.normal((256, 256))
          c = a @ b
          mx.eval(c)
          print(f"matmul on default device ok, shape={c.shape}, device={mx.default_device()}")

          try:
              hasattr(mx, "fast") and hasattr(mx.fast, "metal_kernel")
              print(f"mx.fast.metal_kernel present: {hasattr(mx.fast, 'metal_kernel')}")
          except Exception as e:
              print(f"metal_kernel check failed: {e}")
          PY

      - name: Run Metal-gated test subset
        if: inputs.run_metal_tests
        run: |
          python -m pytest veloxquant_mlx/tests/metal/test_warmup.py \
                            veloxquant_mlx/tests/metal/test_tova_evict.py \
                            -v --durations=0
